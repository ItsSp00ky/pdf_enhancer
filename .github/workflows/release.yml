name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtpdf"

      - name: Ensure Qt6_DIR is set
        shell: powershell
        run: |
          if (-not $env:Qt6_DIR) {
            $qmake = Get-Command qmake.exe -ErrorAction SilentlyContinue
            if (-not $qmake) {
              $qmakeEntry = Get-ChildItem -Path 'C:\Qt' -Filter 'qmake.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($qmakeEntry) { $qmake = $qmakeEntry }
            }
            if (-not $qmake) {
              Write-Host "Could not auto-detect qmake/Qt installation location. Listing C:\Qt for debugging:"
              Get-ChildItem -Path C:\Qt -Force -ErrorAction SilentlyContinue | Select-Object -First 50
              Write-Error "Qt install not found. Ensure the installer placed Qt under C:\Qt or set Qt6_DIR manually."
              exit 1
            }
            $qtRoot = Split-Path $qmake.Path -Parent | Split-Path -Parent
            Write-Host "Detected Qt6_DIR = $qtRoot"
            echo "Qt6_DIR=$qtRoot" >> $env:GITHUB_ENV
          } else {
            Write-Host "Qt6_DIR already set to $env:Qt6_DIR"
          }

      - name: Setup OpenCV
        shell: powershell
        run: |
          choco install opencv --yes
          echo "OpenCV_DIR=C:/tools/opencv/build" >> $env:GITHUB_ENV
          echo "OPENCV_BIN=C:/tools/opencv/build/x64/vc16/bin" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: powershell
        run: |
          if (-not $env:Qt6_DIR) { Write-Host "Qt6_DIR not set yet (will try to auto-detect)"; }
          cmake -S . -B build -DQt6_DIR="$env:Qt6_DIR" -DOpenCV_DIR="$env:OpenCV_DIR"

      - name: Build C++ Release Binary
        shell: powershell
        run: |
          cmake --build build --config Release

      - name: Deploy Qt & OpenCV Runtime Files
        shell: powershell
        run: |
          if (-not $env:Qt6_DIR) { Write-Error "Qt6_DIR is empty. Cannot run windeployqt."; exit 1 }
          $windeployqt = Join-Path $env:Qt6_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { Write-Error "windeployqt not found at $windeployqt"; exit 1 }
          & $windeployqt --release --no-translations .\build\Release\pdf_enhancer_cpp.exe

          if (-not $env:OPENCV_BIN) { Write-Host "OPENCV_BIN is not set; attempting default path"; }
          $opencvBin = $env:OPENCV_BIN
          if (-not $opencvBin) { $opencvBin = "C:/tools/opencv/build/x64/vc16/bin" }
          $opencvDll = Get-ChildItem -Path $opencvBin -Filter "opencv_world*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($opencvDll) {
            Copy-Item $opencvDll.FullName .\build\Release\ -Force
          } else {
            Write-Host "opencv_world*.dll not found in $opencvBin; continuing without copying OpenCV DLL."
          }
          mkdir -Force release-assets
          Compress-Archive -Path .\build\Release\* -DestinationPath release-assets\PDF_Enhancer_v2.0_Windows_x64.zip

      - name: Upload Windows Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets\PDF_Enhancer_v2.0_Windows_x64.zip

  build-linux:
    name: Build Linux Release (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies (Qt6, OpenCV, CMake, GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-pdf-dev libopencv-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Linux Binary
        run: cmake --build build --config Release -j$(nproc)

      - name: Package Linux Release Tarball
        run: |
          mkdir -p release-assets/pdf-enhancer-linux
          cp build/pdf_enhancer_cpp release-assets/pdf-enhancer-linux/pdf-enhancer
          cp scanner.png release-assets/pdf-enhancer-linux/
          cp README.md LICENSE release-assets/pdf-enhancer-linux/
          chmod +x release-assets/pdf-enhancer-linux/pdf-enhancer
          
          cd release-assets
          tar -czf PDF_Enhancer_v2.0_Linux_x86_64.tar.gz pdf-enhancer-linux/
          cp pdf-enhancer-linux/pdf-enhancer PDF_Enhancer_v2.0_Linux_x86_64

      - name: Upload Linux Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release-assets/PDF_Enhancer_v2.0_Linux_x86_64.tar.gz
            release-assets/PDF_Enhancer_v2.0_Linux_x86_64

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-files

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/PDF_Enhancer_v2.0_Windows_x64.zip
            release-files/PDF_Enhancer_Linux_x86_64.tar.gz
            release-files/PDF_Enhancer_Linux_x86_64
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
